<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#recordBillModal">
  <i class="bi bi-plus-circle me-2"></i>Record New Bill
</button>

<div class="modal fade" id="recordBillModal" tabindex="-1" aria-labelledby="recordBillLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered shadow-lg">
    <div class="modal-content border-0 rounded-4">
      
      <div class="modal-header bg-primary text-white py-3 rounded-top-4">
        <h5 class="modal-title fw-bold" id="recordBillLabel">
          <i class="bi bi-file-earmark-arrow-down me-2"></i>Record Vendor Bill
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4 bg-light-subtle">
        <form id="vendorBillForm" enctype="multipart/form-data">
          
          <div class="row g-4">
            <div class="col-lg-8">
              <div class="card border-0 shadow-sm p-3 mb-3">
                <h6 class="fw-bold mb-3 text-muted small text-uppercase">General Information</h6>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Select Vendor</label>
                    <select class="form-select border-light-subtle shadow-sm" name="vendor_id" required>
                      <option selected disabled>Choose Vendor...</option>
                      <option value="1">Phnom Penh Hardware Ltd.</option>
                      <option value="2">EDC (Electricity)</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label small fw-bold">Link to PO #</label>
                    <input type="text" class="form-control border-light-subtle shadow-sm" placeholder="e.g. PO-2026-005">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label small fw-bold">Invoice Date</label>
                    <input type="date" class="form-control border-light-subtle shadow-sm" required>
                  </div>
                </div>
              </div>

              <div class="card border-0 shadow-sm p-3">
                <h6 class="fw-bold mb-3 text-muted small text-uppercase">Billed Items</h6>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="small text-muted border-bottom">
                      <tr>
                        <th>Item / Description</th>
                        <th width="100" class="text-center">Qty</th>
                        <th width="120" class="text-center">Rate</th>
                        <th width="120" class="text-end">Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="border-bottom-0">
                        <td>
                          <input type="text" class="form-control form-control-sm border-0 bg-light" placeholder="Item name...">
                        </td>
                        <td><input type="number" class="form-control form-control-sm text-center border-0 bg-light" value="1"></td>
                        <td><input type="number" class="form-control form-control-sm text-center border-0 bg-light" value="0.00"></td>
                        <td class="text-end fw-bold">$0.00</td>
                      </tr>
                    </tbody>
                  </table>
                  <button type="button" class="btn btn-sm btn-link text-decoration-none">+ Add Item</button>
                </div>
              </div>
            </div>

            <div class="col-lg-4">
