<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Rental Schedule System</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600;700&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #faf8f6 0%, #f0ece8 100%);
      font-family: 'Crimson Pro', serif;
      padding: 2rem;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 3rem;
      animation: slideDown 0.6s ease;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: 3.5rem;
      font-weight: 300;
      color: #2c2419;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.1rem;
      color: #8b7355;
      font-family: 'Work Sans', sans-serif;
      font-weight: 400;
    }

    .btn-primary {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #b8866f 0%, #9d6b53 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Work Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(184, 134, 111, 0.3);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(184, 134, 111, 0.4);
    }

    .notification {
      position: fixed;
      top: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      color: white;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      z-index: 1000;
      animation: slideDown 0.3s ease;
      font-family: 'Work Sans', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .notification.success {
      background: #4ade80;
    }

    .notification.error {
      background: #f87171;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
    }

    .sidebar {
      animation: fadeIn 0.8s ease 0.2s both;
    }

    .main-content {
      animation: fadeIn 0.8s ease 0.4s both;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(184, 134, 111, 0.08);
      border: 1px solid #e8dfd7;
      margin-bottom: 1.5rem;
    }

    .card h3 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #2c2419;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .building-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .building-btn {
      padding: 1rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-family: 'Work Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      border: 2px solid #e8dfd7;
      background: #f9f6f3;
      color: #2c2419;
      transition: all 0.3s ease;
    }

    .building-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(184, 134, 111, 0.2);
    }

    .building-btn.active {
      background: linear-gradient(135deg, #b8866f 0%, #9d6b53 100%);
      color: white;
      border: none;
    }

    .building-btn .name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .building-btn .details {
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .building-btn.active .details {
      opacity: 0.9;
    }

    .upcoming-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .upcoming-item {
      padding: 1rem;
      background: #f9f6f3;
      border-radius: 8px;
      border-left: 4px solid #b8866f;
      animation: fadeIn 0.4s ease;
    }

    .upcoming-item .name {
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: #2c2419;
      margin-bottom: 0.25rem;
    }

    .upcoming-item .date,
    .upcoming-item .time {
      font-size: 0.85rem;
      color: #8b7355;
      margin-bottom: 0.25rem;
    }

    .calendar-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(184, 134, 111, 0.08);
      border: 1px solid #e8dfd7;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .calendar-header h2 {
      font-size: 2rem;
      font-weight: 400;
      color: #2c2419;
    }

    .calendar-nav {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      padding: 0.5rem 1rem;
      background: #f9f6f3;
      border: 2px solid #e8dfd7;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Work Sans', sans-serif;
      font-weight: 500;
      color: #2c2419;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    .calendar-day-header {
      padding: 0.75rem;
      text-align: center;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: #8b7355;
    }

    .calendar-day {
      min-height: 100px;
      padding: 0.75rem;
      background: #fafafa;
      border: 1px solid #e8dfd7;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .calendar-day:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(184, 134, 111, 0.15);
    }

    .calendar-day.today {
      background: #fff9f5;
      border: 2px solid #b8866f;
    }

    .calendar-day .day-number {
      font-family: 'Work Sans', sans-serif;
      font-weight: 500;
      font-size: 1.1rem;
      color: #2c2419;
      margin-bottom: 0.5rem;
    }

    .calendar-day.today .day-number {
      font-weight: 700;
      color: #b8866f;
    }

    .calendar-event {
      font-size: 0.7rem;
      padding: 0.25rem 0.5rem;
      background: #b8866f;
      color: white;
      border-radius: 4px;
      margin-bottom: 0.25rem;
      font-family: 'Work Sans', sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-more {
      font-size: 0.7rem;
      color: #8b7355;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
    }

    .reservations-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      margin-top: 2rem;
      box-shadow: 0 4px 20px rgba(184, 134, 111, 0.08);
      border: 1px solid #e8dfd7;
    }

    .reservations-card h3 {
      font-size: 1.8rem;
      font-weight: 400;
      color: #2c2419;
      margin-bottom: 1.5rem;
    }

    .reservations-list {
      display: grid;
      gap: 1rem;
    }

    .reservation-item {
      padding: 1.5rem;
      background: #f9f6f3;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
      border-left: 4px solid #b8866f;
      animation: fadeIn 0.4s ease;
    }

    .reservation-header {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .reservation-title {
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      color: #2c2419;
    }

    .reservation-tag {
      padding: 0.25rem 0.75rem;
      background: #b8866f;
      color: white;
      border-radius: 20px;
      font-size: 0.85rem;
      font-family: 'Work Sans', sans-serif;
      font-weight: 500;
    }

    .reservation-details {
      display: flex;
      gap: 1.5rem;
      font-size: 0.95rem;
      color: #8b7355;
      font-family: 'Work Sans', sans-serif;
      flex-wrap: wrap;
    }

    .reservation-detail {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-delete {
      padding: 0.75rem;
      background: #fee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #dc2626;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      background: #fcc;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(44, 36, 25, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 2rem;
      animation: fadeIn 0.3s ease;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: scaleIn 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .modal-header h2 {
      font-size: 2rem;
      font-weight: 400;
      color: #2c2419;
    }

    .btn-close {
      padding: 0.5rem;
      background: #f9f6f3;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      color: #2c2419;
      font-size: 0.95rem;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 0.875rem;
      border: 2px solid #e8dfd7;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Work Sans', sans-serif;
      background: #fafafa;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-secondary {
      flex: 1;
      padding: 1rem;
      background: #f9f6f3;
      border: 2px solid #e8dfd7;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      color: #2c2419;
    }

    .btn-submit {
      flex: 1;
      padding: 1rem;
      background: linear-gradient(135deg, #b8866f 0%, #9d6b53 100%);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 15px rgba(184, 134, 111, 0.3);
    }

    .hidden {
      display: none;
    }

    svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <div>
          <h1>Building Rentals</h1>
          <p>Schedule & manage your property reservations</p>
        </div>
        <button class="btn-primary" id="newReservationBtn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          New Reservation
        </button>
      </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification hidden"></div>

    <!-- Main Grid -->
    <div class="main-grid">
      <!-- Sidebar -->
      <div class="sidebar">
        <!-- Buildings Filter -->
        <div class="card">
          <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Buildings
          </h3>
          <div class="building-list" id="buildingList"></div>
        </div>

        <!-- Upcoming Reservations -->
        <div class="card">
          <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Upcoming
          </h3>
          <div class="upcoming-list" id="upcomingList"></div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Calendar -->
        <div class="calendar-card">
          <div class="calendar-header">
            <h2 id="calendarMonth"></h2>
            <div class="calendar-nav">
              <button class="nav-btn" id="prevMonth">← Prev</button>
              <button class="nav-btn" id="nextMonth">Next →</button>
            </div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- Reservations List -->
        <div class="reservations-card">
          <h3 id="reservationsTitle">All Reservations</h3>
          <div class="reservations-list" id="reservationsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div id="bookingModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>New Reservation</h2>
        <button class="btn-close" id="closeModal">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <form id="bookingForm">
        <div class="form-group">
          <label class="form-label">Building *</label>
          <select id="buildingSelect" class="form-select" required>
            <option value="">Select a building</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Date *</label>
          <input type="date" id="dateInput" class="form-input" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Start Time *</label>
            <input type="time" id="startTimeInput" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">End Time *</label>
            <input type="time" id="endTimeInput" class="form-input" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Renter Name *</label>
          <input type="text" id="renterNameInput" class="form-input" placeholder="Enter renter name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Event Type *</label>
          <input type="text" id="eventInput" class="form-input" placeholder="e.g., Wedding, Conference, Workshop" required>
        </div>

        <div class="form-group">
          <label class="form-label">Expected Attendees *</label>
          <input type="number" id="attendeesInput" class="form-input" min="1" placeholder="Number of attendees" required>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-submit">Create Reservation</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Data
    const buildings = [
      { id: 1, name: 'Riverside Loft', location: 'Downtown', capacity: 150 },
      { id: 2, name: 'Garden Pavilion', location: 'Westside', capacity: 80 },
      { id: 3, name: 'Skyview Hall', location: 'Midtown', capacity: 200 },
      { id: 4, name: 'Heritage Room', location: 'Old Quarter', capacity: 60 }
    ];

    let reservations = [
      { id: 1, buildingId: 1, date: '2026-02-15', startTime: '14:00', endTime: '18:00', renterName: 'Sarah Mitchell', event: 'Corporate Workshop', attendees: 45 },
      { id: 2, buildingId: 2, date: '2026-02-18', startTime: '10:00', endTime: '15:00', renterName: 'James Chen', event: 'Wedding Reception', attendees: 75 },
      { id: 3, buildingId: 1, date: '2026-02-22', startTime: '09:00', endTime: '12:00', renterName: 'Emma Davis', event: 'Art Exhibition', attendees: 30 }
    ];

    let currentDate = new Date(2026, 1, 10); // Feb 10, 2026
    let selectedBuilding = null;

    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];

    // Utility Functions
    function formatTime(time) {
      const [hours, minutes] = time.split(':');
      const h = parseInt(hours);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const displayHour = h % 12 || 12;
      return `${displayHour}:${minutes} ${ampm}`;
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function getDaysInMonth(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = firstDay.getDay();
      
      const days = [];
      
      for (let i = 0; i < startingDayOfWeek; i++) {
        days.push(null);
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        days.push(new Date(year, month, day));
      }
      
      return days;
    }

    function getReservationsForDate(date, buildingId = null) {
      if (!date) return [];
      const dateStr = date.toISOString().split('T')[0];
      return reservations.filter(res => {
        const matchesDate = res.date === dateStr;
        const matchesBuilding = buildingId ? res.buildingId === buildingId : true;
        return matchesDate && matchesBuilding;
      });
    }

    function checkTimeConflict(buildingId, date, startTime, endTime, excludeId = null) {
      const dateStr = typeof date === 'string' ? date : date.toISOString().split('T')[0];
      const dayReservations = reservations.filter(res => 
        res.buildingId === buildingId && 
        res.date === dateStr &&
        res.id !== excludeId
      );

      return dayReservations.some(res => {
        const resStart = res.startTime;
        const resEnd = res.endTime;
        return (startTime < resEnd && endTime > resStart);
      });
    }

    function showNotification(type, message) {
      const notification = document.getElementById('notification');
      notification.className = `notification ${type}`;
      notification.innerHTML = `
        ${type === 'success' ? 
          '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>' :
          '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
        }
        ${message}
      `;
      notification.classList.remove('hidden');
      setTimeout(() => notification.classList.add('hidden'), 3000);
    }

    // Render Functions
    function renderBuildings() {
      const buildingList = document.getElementById('buildingList');
      const buildingSelect = document.getElementById('buildingSelect');
      
      buildingList.innerHTML = `
        <button class="building-btn ${!selectedBuilding ? 'active' : ''}" onclick="selectBuilding(null)">
          All Buildings
        </button>
        ${buildings.map(building => `
          <button class="building-btn ${selectedBuilding?.id === building.id ? 'active' : ''}" 
                  onclick="selectBuilding(${building.id})">
            <div class="name">${building.name}</div>
            <div class="details">${building.location} • Cap. ${building.capacity}</div>
          </button>
        `).join('')}
      `;

      buildingSelect.innerHTML = `
        <option value="">Select a building</option>
        ${buildings.map(b => `
          <option value="${b.id}">${b.name} - ${b.location}</option>
        `).join('')}
      `;
    }

    function renderUpcoming() {
      const upcomingList = document.getElementById('upcomingList');
      const filteredReservations = selectedBuilding 
        ? reservations.filter(res => res.buildingId === selectedBuilding.id)
        : reservations;
      
      const upcoming = filteredReservations
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(0, 5);

      upcomingList.innerHTML = upcoming.map(res => {
        const building = buildings.find(b => b.id === res.buildingId);
        return `
          <div class="upcoming-item">
            <div class="name">${building.name}</div>
            <div class="date">${new Date(res.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
            <div class="time">${formatTime(res.startTime)} - ${formatTime(res.endTime)}</div>
          </div>
        `;
      }).join('');
    }

    function renderCalendar() {
      const calendarMonth = document.getElementById('calendarMonth');
      const calendarGrid = document.getElementById('calendarGrid');
      
      calendarMonth.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
      
      const days = getDaysInMonth(currentDate);
      const today = new Date(2026, 1, 10);
      
      let gridHTML = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        .map(day => `<div class="calendar-day-header">${day}</div>`)
        .join('');
      
      gridHTML += days.map(date => {
        if (!date) return '<div></div>';
        
        const dayReservations = getReservationsForDate(date, selectedBuilding?.id);
        const isToday = date.toDateString() === today.toDateString();
        const dateStr = date.toISOString().split('T')[0];
        
        return `
          <div class="calendar-day ${isToday ? 'today' : ''}" onclick="openBookingModal('${dateStr}')">
            <div class="day-number">${date.getDate()}</div>
            ${dayReservations.slice(0, 2).map(res => {
              const building = buildings.find(b => b.id === res.buildingId);
              return `<div class="calendar-event">${building.name.substring(0, 12)}...</div>`;
            }).join('')}
            ${dayReservations.length > 2 ? `<div class="calendar-more">+${dayReservations.length - 2} more</div>` : ''}
          </div>
        `;
      }).join('');
      
      calendarGrid.innerHTML = gridHTML;
    }

    function renderReservations() {
      const reservationsList = document.getElementById('reservationsList');
      const reservationsTitle = document.getElementById('reservationsTitle');
      
      const filteredReservations = selectedBuilding 
        ? reservations.filter(res => res.buildingId === selectedBuilding.id)
        : reservations;
      
      reservationsTitle.textContent = `All Reservations${selectedBuilding ? ` - ${selectedBuilding.name}` : ''}`;
      
      reservationsList.innerHTML = filteredReservations.map(res => {
        const building = buildings.find(b => b.id === res.buildingId);
        return `
          <div class="reservation-item">
            <div>
              <div class="reservation-header">
                <div class="reservation-title">${res.event}</div>
                <div class="reservation-tag">${building.name}</div>
              </div>
              <div class="reservation-details">
                <div class="reservation-detail">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                  ${formatDate(res.date)}
                </div>
                <div class="reservation-detail">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  ${formatTime(res.startTime)} - ${formatTime(res.endTime)}
                </div>
                <div class="reservation-detail">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  ${res.renterName}
                </div>
              </div>
            </div>
            <button class="btn-delete" onclick="deleteReservation(${res.id})">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    // Event Handlers
    function selectBuilding(buildingId) {
      selectedBuilding = buildingId ? buildings.find(b => b.id === buildingId) : null;
      renderAll();
    }

    function openBookingModal(dateStr = '') {
      const modal = document.getElementById('bookingModal');
      const dateInput = document.getElementById('dateInput');
      modal.classList.remove('hidden');
      if (dateStr) {
        dateInput.value = dateStr;
      }
    }

    function closeBookingModal() {
      const modal = document.getElementById('bookingModal');
      const form = document.getElementById('bookingForm');
      modal.classList.add('hidden');
      form.reset();
    }

    function deleteReservation(id) {
      reservations = reservations.filter(res => res.id !== id);
      showNotification('success', 'Reservation cancelled successfully!');
      renderAll();
    }

    function handleSubmitBooking(e) {
      e.preventDefault();
      
      const buildingId = parseInt(document.getElementById('buildingSelect').value);
      const date = document.getElementById('dateInput').value;
      const startTime = document.getElementById('startTimeInput').value;
      const endTime = document.getElementById('endTimeInput').value;
      const renterName = document.getElementById('renterNameInput').value;
      const event = document.getElementById('eventInput').value;
      const attendees = parseInt(document.getElementById('attendeesInput').value);
      
      const hasConflict = checkTimeConflict(buildingId, date, startTime, endTime);
      
      if (hasConflict) {
        showNotification('error', 'Time slot conflict! This building is already booked during this time.');
        return;
      }
      
      const newReservation = {
        id: Date.now(),
        buildingId,
        date,
        startTime,
        endTime,
        renterName,
        event,
        attendees
      };
      
      reservations.push(newReservation);
      showNotification('success', 'Reservation created successfully!');
      closeBookingModal();
      renderAll();
    }

    function renderAll() {
      renderBuildings();
      renderUpcoming();
      renderCalendar();
      renderReservations();
    }

    // Event Listeners
    document.getElementById('newReservationBtn').addEventListener('click', () => openBookingModal());
    document.getElementById('closeModal').addEventListener('click', closeBookingModal);
    document.getElementById('cancelBtn').addEventListener('click', closeBookingModal);
    document.getElementById('bookingForm').addEventListener('submit', handleSubmitBooking);
    
    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      renderCalendar();
    });
    
    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      renderCalendar();
    });

    // Initialize
    renderAll();
  </script>
</body>
</html>
