<div class="modal fade" id="receivePaymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Receive Payment - <span id="display_bill_no"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="paymentForm">
        <div class="modal-body">
          <input type="hidden" id="bill_id" name="bill_id">
          
          <div class="row mb-3">
            <div class="col-6">
              <label class="form-label text-muted small">Total Amount</label>
              <input type="text" class="form-control bg-light" id="total_amount" readonly>
            </div>
            <div class="col-6">
              <label class="form-label text-muted small">Current Balance</label>
              <input type="text" class="form-control bg-light text-danger fw-bold" id="current_balance" readonly>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Receive Amount ($)</label>
            <input type="number" step="0.01" class="form-control form-control-lg border-primary" id="receive_amount" name="receive_amount" placeholder="0.00" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small">New Balance After Payment</label>
            <input type="text" class="form-control bg-light fw-bold text-success" id="new_balance" readonly value="0.00">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Confirm Payment</button>
        </div>
      </form>
    </div>
  </div>
</div>
